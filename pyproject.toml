[project]
name = "solar-rooftops"
version = "1.0.0"
description = "Rooftop photovoltaic potential from satellite imagery with YOLO11 instance segmentation"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "matplotlib",
    "pillow",
    "shapely>=2.0",
]

[project.optional-dependencies]
model = ["ultralytics>=8.3"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
